<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動漫收藏｜我的動漫收藏庫</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <nav class="navbar">
        <a href="index.html">首頁</a>
        <a href="catalog.html">動漫收藏</a>
        <a href="index.html#statistics">動漫統計</a>
        <a href="watchlist.html">待看清單</a>
        <a href="random.html">隨機抽籤</a>
    </nav>

    <main>
        <section id="catalog" class="catalog">
            <h2>🎌 動漫收藏</h2>

            <div class="anime-form">
                <input type="number" id="anime-number" placeholder="觀看順序" min="0" step="any">
                <input type="text" id="anime-title" placeholder="動漫名稱，例如：刀劍神域">
                <input type="url" id="anime-image" placeholder="請輸入圖片網址 (https://...)">

                <select id="anime-rating">
                    <option value="0">尚未評分</option>
                    <option value="1">⭐ 1 分</option>
                    <option value="2">⭐ 2 分</option>
                    <option value="3">⭐ 3 分</option>
                    <option value="4">⭐ 4 分</option>
                    <option value="5">⭐ 5 分</option>
                </select>

                <button id="add-anime-button" type="button">＋ 新增動漫</button>
            </div>

            <div class="anime-search">
                <span class="search-icon">🔍</span>
                <input
                    type="text"
                    id="search-anime"
                    placeholder="搜尋動漫名稱或觀看順序..."
                    autocomplete="off"
                >
                <button id="clear-search" type="button">清除</button>
            </div>

            <div id="anime-list" class="anime-list"></div>
        </section>
    </main>

    <footer>
        <p>我的動漫收藏庫 © 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
