<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的動漫收藏庫</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase 核心與 Firestore SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>

<body>

    <!-- 網站上方導覽列 -->
    <nav class="navbar">
        <a href="#home">首頁</a>
        <a href="#catalog">動漫目錄</a>
        <a href="#statistics">動漫統計</a>
    </nav>

    <!-- 大型首頁橫幅 -->
    <header id="home" class="hero">
        <div class="hero-content">
            <p class="hero-subtitle">MY ANIME COLLECTION</p>
            <h1>我的動漫收藏庫</h1>
            <p>記錄每一部作品，收藏每一份感動。</p>
            <a href="#catalog" class="hero-button">探索動漫收藏 ↓</a>
        </div>
    </header>

    <!-- 圖片下方的網站目錄 -->
    <main>

        <section class="menu">
            <h2>網站目錄</h2>
            <p>選擇你想瀏覽的內容</p>

            <div class="menu-list">
                <a href="#catalog" class="menu-card">
                    <span>🎌</span>
                    <h3>動漫收藏</h3>
                    <p>瀏覽看過的所有動畫</p>
                </a>

                <a href="#statistics" class="menu-card">
                    <span>📊</span>
                    <h3>動漫統計</h3>
                    <p>查看收藏數量與評分</p>
                </a>
            </div>
        </section>

        <!-- 動漫收藏區 -->
        <section id="catalog" class="catalog">
            <h2>🎌 動漫收藏</h2>
            <p>新增你看過的動畫，建立自己的收藏清單！</p>

            <div class="anime-form">
                <input type="number" id="anime-number" placeholder="觀看順序，例如：1" min="1">
                <input type="text" id="anime-title" placeholder="動漫名稱，例如：刀劍神域">
                <!-- 這裡已從 file 改成 url 網址輸入框 -->
                <input type="url" id="anime-image" placeholder="請輸入圖片網址 (https://...)">

                <select id="anime-rating">
                    <option value="0">尚未評分</option>
                    <option value="1">⭐ 1 分</option>
                    <option value="2">⭐ 2 分</option>
                    <option value="3">⭐ 3 分</option>
                    <option value="4">⭐ 4 分</option>
                    <option value="5">⭐ 5 分</option>
                </select>

                <button id="add-anime-button" type="button">＋ 新增動漫</button>
            </div>

            <!-- 動漫搜尋區 -->
            <div class="anime-search">
                <span class="search-icon">🔍</span>
                <input
                    type="text"
                    id="search-anime"
                    placeholder="搜尋動漫名稱或觀看順序..."
                    autocomplete="off"
                >
                <button id="clear-search" type="button">清除</button>
            </div>

            <div id="anime-list" class="anime-list"></div>
        </section>

        <!-- 統計區 -->
        <section id="statistics" class="statistics">
            <h2>📊 動漫統計</h2>
            <p>統計你的動漫收藏紀錄</p>

            <div class="stats-container">
                <div class="stats-card">
                    <span class="stats-icon">🎌</span>
                    <h3>收藏總數</h3>
                    <p id="total-anime">0 部</p>
                </div>

                <div class="stats-card">
                    <span class="stats-icon">⭐</span>
                    <h3>已評分作品</h3>
                    <p id="rated-anime">0 部</p>
                </div>

                <div class="stats-card">
                    <span class="stats-icon">📈</span>
                    <h3>平均評分</h3>
                    <p id="average-rating">尚無評分</p>
                </div>

                <div class="stats-card">
                    <span class="stats-icon">🏆</span>
                    <h3>最高評分</h3>
                    <p id="highest-rating">尚無評分</p>
                </div>
            </div>
        </section>

    </main>

    <footer>
        <p>我的動漫收藏庫 © 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
